name: Deploy the chronicle to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read the actual Pages address
        id: pages
        uses: actions/configure-pages@v5
      - name: Configure the publication URL
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const url = new URL(process.env.PAGES_BASE_URL);
          const base = url.pathname.endsWith('/') ? url.pathname : url.pathname + '/';
          appendFileSync(process.env.GITHUB_ENV, `SITE_URL=${url.origin}\nBASE_PATH=${base}\n`);
          NODE
      - run: npm ci
      - run: npm test
      - name: Build and verify the single-page publication
        run: npm run build
        env:
          PUBLICATION_DATE: ${{ vars.PUBLICATION_DATE }}
          MODIFIED_DATE: ${{ vars.MODIFIED_DATE }}
          EDITORIAL_BYLINE: ${{ vars.EDITORIAL_BYLINE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
